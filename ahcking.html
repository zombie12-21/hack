<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL_ACCESS_V4.2</title>
    <style>
        body {
            background-color: black;
            color: #00ff41; /* Classic Matrix Green */
            font-family: 'Courier New', Courierly, monospace;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            text-shadow: 0 0 5px #00ff41;
        }

        #terminal {
            white-space: pre-wrap;
            line-height: 1.4;
            font-size: 14px;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 18px;
            background-color: #00ff41;
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        .highlight {
            color: white;
            font-weight: bold;
        }

        .danger {
            color: #ff3333;
            text-shadow: 0 0 5px #ff3333;
        }
    </style>
</head>
<body>

    <div id="terminal"></div><span class="cursor"></span>

    <script>
        const terminal = document.getElementById('terminal');
        
        const logs = [
            "Initializing handshake with remote server...",
            "Establishing secure tunnel via Proxy 192.168.1.1...",
            "Bypassing Firewall... [SUCCESS]",
            "Injecting SQL payload into auth_database...",
            "Searching for admin credentials...",
            "CRACKING PASSWORD: admin / ********",
            "Access granted. Welcome, Root User.",
            "Downloading encrypted files: /etc/shadow...",
            "Packet intercept active. Monitoring traffic...",
            "Warning: Intrusion Detection System triggered!",
            "Rerouting IP to avoid detection... [DONE]",
            "Accessing private key 0x8821B... [SENSITIVE DATA]",
            "Syncing with satellite uplink...",
            "Deleting log traces from server..."
        ];

        const randomWords = ["SYNC", "DATA", "NULL", "VOID", "BUFFER", "OVERFLOW", "KERNEL", "SPOOL"];

        async function typeText(text, speed = 50) {
            for (let char of text) {
                terminal.innerHTML += char;
                await new Promise(res => setTimeout(res, speed));
            }
            terminal.innerHTML += "\n";
        }

        async function runSimulation() {
            // Start with a slow intro
            await typeText(">> SYSTEM BOOT SEQUENCE STARTING...", 100);
            await new Promise(res => setTimeout(res, 500));
            
            // Loop through the "hacking" logs
            for (let i = 0; i < logs.length; i++) {
                let log = logs[i];
                
                // Randomize speed for realism (sometimes fast, sometimes slow)
                let speed = Math.random() * 40 + 20;
                
                // Add random "noise" data before the main log
                for(let j=0; j<3; j++) {
                    let noise = `[${Math.random().toString(16).substring(2, 8)}] ${randomWords[Math.floor(Math.random()*randomWords.length)]} ... `;
                    terminal.innerHTML += `<span style="opacity: 0.5">${noise}</span>`;
                }
                terminal.innerHTML += "\n";

                await typeText(log, speed);
                await new Promise(res => setTimeout(res, Math.random() * 1000));
            }

            await typeText(">> SESSION TERMINATED. CONNECTION CLOSED.", 100);
        }

        // Start the sequence
        runSimulation();
    </script>
</body>
</html>
