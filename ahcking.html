<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            cursor: default;
        }

        #start-screen {
            text-align: center;
        }

        .btn {
            background-color: #f00;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 10px #f00;
        }

        #hack-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 10px solid red;
            box-sizing: border-box;
        }

        .warning-text {
            font-size: 40px;
            color: red;
            font-weight: bold;
            text-transform: uppercase;
            animation: blink 0.5s infinite;
        }

        .payment-text {
            font-size: 24px;
            margin: 20px 0;
            color: #fff;
        }

        #code-input {
            background: black;
            border: 2px solid #0f0;
            color: #0f0;
            padding: 10px;
            font-size: 20px;
            text-align: center;
            outline: none;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <button class="btn" onclick="startHack()">roblox unblock</button>
    </div>

    <div id="hack-screen">
        <div class="warning-text">SYSTEM CRITICAL: DEVICE HACKED</div>
        <p class="payment-text">Your files are encrypted. To recover them, pay <strong>$10,000</strong> to the administrator.</p>
        <p style="color: #aaa;">Or enter the decryption key to unlock:</p>
        <input type="text" id="code-input" placeholder="Enter Key..." oninput="checkCode()">
        <p id="status" style="color: red; margin-top: 10px;">ACCESS DENIED</p>
    </div>

    <script>
        function startHack() {
            // Request Fullscreen
            var elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { 
                elem.webkitRequestFullscreen(); 
            } else if (elem.msRequestFullscreen) { 
                elem.msRequestFullscreen(); 
            }

            // Show the "Hack" screen
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('hack-screen').style.display = 'flex';
        }

        function checkCode() {
            var input = document.getElementById('code-input').value;
            var status = document.getElementById('status');
            
            // The secret code
            if (input === "9676911025") {
                status.innerHTML = "ACCESS GRANTED. UNLOCKING...";
                status.style.color = "#0f0";
                
                setTimeout(function() {
                    alert("Your computer has been restored!");
                    location.reload(); // Reset the page
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }, 2000);
            } else {
                status.innerHTML = "ACCESS DENIED";
                status.style.color = "red";
            }
        }
    </script>
</body>
</html>
